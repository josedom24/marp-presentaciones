name: Build Marp Presentations

on:
  push:
    paths:
      - '**/*.md'
      - '!README.md'
      - '.marprc.yml'
      - 'tema-profesional.css'
      - '.github/workflows/build-marp.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '!README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Get changed files
        id: changed-files
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v42
        with:
          files: |
            **/*.md
          files_ignore: |
            README.md

      - name: Build presentations
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Modo dispatch: reconstruyendo todas las presentaciones"
            mapfile -t FILES < <(find . -name '*.md' ! -name 'README.md')
          else
            echo "Modo push: reconstruyendo ficheros modificados"
            read -ra FILES <<< "${{ steps.changed-files.outputs.all_changed_files }}"
          fi

          # Guardamos la lista de PDFs generados para poder purgarlos después,
          # en un paso posterior que corre en un shell distinto.
          > generated_pdfs.txt
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Processing: $file"
              marp "$file" --pdf --allow-local-files -o "${file%.*}.pdf"
              echo "${file%.*}.pdf" >> generated_pdfs.txt
            fi
          done

      - name: Commit and push changes
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            git add '*.pdf' 2>/dev/null || true
            git status
            git commit -m "chore: build marp presentations [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Purge jsDelivr cache for updated PDFs
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ ! -s generated_pdfs.txt ]; then
            echo "No hay PDFs generados, nada que purgar."
            exit 0
          fi

          while IFS= read -r pdf; do
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${pdf}"
            echo "Purgando: $url"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" "$url"
          done < generated_pdfs.txt
